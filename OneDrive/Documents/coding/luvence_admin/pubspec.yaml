name: luvence_admin
description: "LUVENCE ID Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter


  # Supabase
  supabase_flutter: ^2.12.4

  # UI & Charts
  fl_chart: ^1.2.0
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#0B0D14"
  image: assets/images/logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0B0D14"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
